name: Android CI and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: android-release-main
  cancel-in-progress: false

jobs:
  test-and-release:
    name: Test and create release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Decode release keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_RELEASE_KEYSTORE_BASE64}" ]; then
            echo "::error::Missing ANDROID_RELEASE_KEYSTORE_BASE64 secret"
            exit 1
          fi
          if [ -z "${ANDROID_RELEASE_KEYSTORE_PASSWORD}" ]; then
            echo "::error::Missing ANDROID_RELEASE_KEYSTORE_PASSWORD secret"
            exit 1
          fi
          if [ -z "${ANDROID_RELEASE_KEY_ALIAS}" ]; then
            echo "::error::Missing ANDROID_RELEASE_KEY_ALIAS secret"
            exit 1
          fi
          if [ -z "${ANDROID_RELEASE_KEY_PASSWORD}" ]; then
            echo "::error::Missing ANDROID_RELEASE_KEY_PASSWORD secret"
            exit 1
          fi

          mkdir -p "${RUNNER_TEMP}/keystore"
          printf "%s" "${ANDROID_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/keystore/release.jks"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/keystore/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare release APK
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk "release-assets/Schengen Tracker.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Schengen Tracker
          path: release-assets/Schengen Tracker.apk
          if-no-files-found: error

      - name: Prepare release metadata
        id: release
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="main-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"

          cat > release-notes.md <<EOF
          Automated release from a merge to main.

          Commit: ${GITHUB_SHA}

          Checks run:
          - ./gradlew testDebugUnitTest
          - ./gradlew assembleRelease

          APK:
          - Schengen Tracker.apk
          EOF

          echo "short_sha=${SHORT_SHA}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" \
            "release-assets/Schengen Tracker.apk" \
            --target "${GITHUB_SHA}" \
            --title "Main release ${{ steps.release.outputs.short_sha }}" \
            --notes-file release-notes.md
